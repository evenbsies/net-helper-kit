name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck dnsmasq-base busybox-static
      - name: Static and functional tests
        run: ./tests/run.sh
